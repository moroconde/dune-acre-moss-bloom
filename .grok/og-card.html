<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
@font-face {
  font-family: "LibSerif";
  src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "LibSerif";
  src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
}
@font-face {
  font-family: "LibSerif";
  src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
html, body {
  margin: 0;
  padding: 0;
  width: 1792px;
  height: 1008px;
  overflow: hidden;
  background: #F3EEE4;
}
.card {
  width: 1792px;
  height: 1008px;
  background: url("file:///workspace/artifacts/imagine_images/df493624-9154-4579-8e11-acf3a8add0c8.jpg") center / cover no-repeat;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 72px 160px;
}
.heart {
  height: 340px;
  width: auto;
  display: block;
  margin: 0 0 28px;
  filter: drop-shadow(0 10px 18px rgba(28, 26, 23, 0.08));
}
.lockup {
  text-align: center;
  color: #1C1A17;
  max-width: 1120px;
}
h1 {
  font-family: "LibSerif", "Liberation Serif", serif;
  font-style: italic;
  font-weight: 400;
  font-size: 92px;
  line-height: 0.95;
  letter-spacing: 0.01em;
  margin: 0;
}
h1 span {
  font-style: italic;
}
.sub {
  font-family: "LibSerif", "Liberation Serif", serif;
  font-style: normal;
  font-weight: 400;
  font-size: 34px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: #3E5345;
  margin: 22px 0 0;
  padding: 18px 0 0;
  border-top: 1px solid rgba(62, 83, 69, 0.35);
  display: inline-block;
  min-width: 640px;
}
</style>
</head>
<body>
  <div class="card">
    <img class="heart" src="file:///workspace/.grok/heart-cut.png" alt="" />
    <div class="lockup">
      <h1>Miriam Eguía</h1>
      <div class="sub">Nutrición</div>
    </div>
  </div>
</body>
</html>
